<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150" role="img" aria-labelledby="title desc">
<title id="title">Web, APIs e IoT</title><desc id="desc">Interfaces, servicios y dispositivos conectados. Animación decorativa.</desc>
<defs><linearGradient id="line"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
<style>
.panel{fill:#0d1117;stroke:#30363d}.label{fill:#e6edf3;font:600 17px monospace}.sub{fill:#8b949e;font:12px monospace}.wire{fill:none;stroke:#30363d;stroke-width:2}.pulse{fill:none;stroke:url(#line);stroke-width:3;stroke-dasharray:16 164;animation:flow 3s linear infinite}.led{fill:#22c55e;animation:breathe 2.8s ease-in-out infinite}.cursor{fill:#38bdf8;animation:blink 1.4s steps(2,end) infinite}
@keyframes flow{to{stroke-dashoffset:-180}}@keyframes breathe{50%{opacity:.3}}@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="panel" x="1" y="1" width="878" height="148" rx="18"/>
<path class="wire" d="M240 75H350M530 75H640"/><path class="pulse" d="M240 75H350M530 75H640"/>
<g><rect class="panel" x="30" y="30" width="210" height="90" rx="12"/><text class="label" x="52" y="64">&lt;/&gt; Interfaces</text><text class="sub" x="52" y="91">React · TypeScript</text><rect class="cursor" x="211" y="80" width="7" height="13"/></g>
<g><rect class="panel" x="350" y="30" width="180" height="90" rx="12"/><text class="label" x="373" y="64">{ } APIs</text><text class="sub" x="373" y="91">Lógica + datos</text><circle class="led" cx="509" cy="50" r="4"/></g>
<g><rect class="panel" x="640" y="30" width="210" height="90" rx="12"/><text class="label" x="663" y="64">⌁ Dispositivos</text><text class="sub" x="663" y="91">ESP32 · IoT</text><circle class="led" cx="829" cy="50" r="4" style="animation-delay:1s"/></g>
</svg>